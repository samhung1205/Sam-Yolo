name: Sam-Yolo CI

on:
  push:
    branches: [main, sam-main]
  pull_request:
    branches: [main, sam-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam-yolo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install "PyYAML==6.0.3"
      - name: Validate project sources and configurations
        run: python scripts/check_repository.py
